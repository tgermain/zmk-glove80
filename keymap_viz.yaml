draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: auto
  n_columns: 1
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: false
  key_side_pars:
    rel_x: 0
    rel_y: 4
    rel_w: 12
    rel_h: 12
    rx: 4
    ry: 4
  svg_extra_style: ''
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 18
  glyph_hold_size: 14
  glyph_shifted_size: 12
  glyphs: {}
parse_config:
  preprocess: true
  skip_binding_parsing: false
  raw_binding_map: {}
  sticky_label: $$mdi:gesture-tap-hold$$
  toggle_label: $$mdi:toggle-switch$$
  tap_toggle_label: tap-toggle
  trans_legend:
    t: ▽
    type: trans
  layer_legend_map: {}
  mark_alternate_layer_activators: false
  modifier_fn_map:
    left_ctrl: Ctl
    right_ctrl: Ctl
    left_shift: Sft
    right_shift: Sft
    left_alt: Alt
    right_alt: AltGr
    left_gui: Gui
    right_gui: Gui
    keycode_combiner: '{mods}+{key}'
    mod_combiner: '{mod_1}+{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
  qmk_remove_keycode_prefix:
  - KC_
  - FR_
  qmk_keycode_map:
    XXXXXXX: ''
    'NO': ''
    MINUS: '-'
    MINS: '-'
    EQUAL: '='
    EQL: '='
    LEFT_BRACKET: '['
    LBRC: '['
    RIGHT_BRACKET: ']'
    RBRC: ']'
    BACKSLASH: \
    BSLS: \
    NONUS_HASH: '#'
    NUHS: '#'
    SEMICOLON: ;
    SCLN: ;
    QUOTE: ''''
    QUOT: ''''
    GRAVE: '`'
    GRV: '`'
    COMMA: ','
    COMM: ','
    DOT: .
    SLASH: /
    SLSH: /
    TILDE: '~'
    TILD: '~'
    EXCLAIM: '!'
    EXLM: '!'
    AT: '@'
    HASH: '#'
    DOLLAR: $
    DLR: $
    PERCENT: '%'
    PERC: '%'
    CIRCUMFLEX: ^
    CIRC: ^
    AMPERSAND: '&'
    AMPR: '&'
    ASTERISK: '*'
    ASTR: '*'
    LEFT_PAREN: (
    LPRN: (
    RIGHT_PAREN: )
    RPRN: )
    UNDERSCORE: _
    UNDS: _
    PLUS: +
    LEFT_CURLY_BRACE: '{'
    LCBR: '{'
    RIGHT_CURLY_BRACE: '}'
    RCBR: '}'
    PIPE: '|'
    COLON: ':'
    COLN: ':'
    DOUBLE_QUOTE: '"'
    DQUO: '"'
    DQT: '"'
    LEFT_ANGLE_BRACKET: <
    LABK: <
    LT: <
    RIGHT_ANGLE_BRACKET: '>'
    RABK: '>'
    GT: '>'
    QUESTION: '?'
    QUES: '?'
  zmk_remove_keycode_prefix:
  - KC_
  - FR_
  - fr_
  zmk_keycode_map:
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    DLR: $
    PERCENT: '%'
    PRCNT: '%'
    FR_PERC: '%'
    CARET: ^
    CIRC: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    RPRN: )
    EQUAL: '='
    PLUS: +
    MINUS: '-'
    UNDERSCORE: _
    UNDER: _
    SLASH: /
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    BACKSLASH: \
    BSLS: \
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    SEMICOLON: ;
    SEMI: ;
    COLON: ':'
    SINGLE_QUOTE: ''''
    SQT: ''''
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ','
    LESS_THAN: <
    LT: <
    LABK:
      tap: <
      shifted: '>'
    PERIOD: .
    DOT: .
    GREATER_THAN: '>'
    GT: '>'
    LBRC: '['
    LCBR: '{'
    RBRC: ']'
    RCBR: '}'
    GRV: '`'
    TILD: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    TILDE2: '~'
    AMPR: "&"
    EACU: "é"
    DQUO: "\""
    FR_QUOT: "'"
    FR_LPRN: "("
    FR_MINS: "-"
    FR_EGRV: "è"
    FR_UNDS: "_"
    FR_CCED: "ç"
    FR_AGRV: "à"
    FR_COMM: ","
    FR_SCLN: ";"
    FR_COLN: ":"
    FR_EXLM: "!"
    LALT: "AltGr"
    KP_EQUAL: "="
    FR_UGRV: "ù"
    LCTRL: "Ctrl"
    RCTRL: "Ctrl"

    # Modifiers
    LSHIFT: $$mdi:apple-keyboard-shift$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    RSHIFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$

    # Arrows
    UP: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$
    PG_UP: $$mdi:transfer-up$$
    PG_DN: $$mdi:transfer-down$$

        # Whitespace
    RET:
      type: enter
      tap: $$mdi:keyboard-return$$
    ESC: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    LS(TAB): $$mdi:keyboard-tab-reverse$$
    SPACE: $$mdi:keyboard-space$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    DELETE: $$mdi:backspace-reverse-outline$$
    DEL: $$mdi:backspace-reverse-outline$$
        # Media
    C_NEXT: $$mdi:skip-next$$
    C_PREV: $$mdi:skip-previous$$
    C_PP: $$mdi:play-pause$$

    # Sound
    C_MUTE: $$mdi:volume-off$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-low$$

    HOME: $$mdi:arrow-collapse-up$$
    END: $$mdi:arrow-collapse-down$$

    LEFT_GUI: $$mdi:linux$$
    LGUI: $$mdi:linux$$
    RIGHT_GUI: $$mdi:linux$$
    RGUI: $$mdi:linux$$
    RALT: AltGr
  zmk_combos: {}
  zmk_preamble: '#define KEYMAP_DRAWER'
  zmk_additional_includes: []
  raw_binding_map:
    "&bsp_del":
      type: backspace
      tap: $$mdi:backspace$$
      shifted: $$mdi:backspace-reverse-outline$$  
    "&meh":
      tap: $$mdi:cards$$
    "&kp FR_DOT":
      tap: "."
    "&s_d_cl":
      tap: $$material:shift$$
      tl: $$material:shift_lock$$
    "&rgb_ug_status_macro": $$mdi:led-outline$$
    "&fr_a_diaeresis": ä
    "&fr_e_diaeresis": ë
    "&fr_u_diaeresis": ü
    "&fr_i_diaeresis": ï
    "&fr_a_circumflex": â
    "&fr_e_circumflex": ê
    "&fr_u_circumflex": û
    "&fr_i_circumflex": î
    "&fr_o_circumflex": ô
    '&out OUT_USB':
      tap: $$mdi:keyboard$$ 
      right: $$mdi:usb$$
      type: sym_by_sym
    '&bt BT_CLR':
      tap: $$mdi:bluetooth-settings$$
      right: $$mdi:close-thick$$
      type: sym_sub_text
    '&bootloader':
      tap:     $$mdi:flash$$
      right: $$mdi:micro-sd$$
    '&sys_reset':
      tap: $$material:reset_wrench$$
    '&bt_0':
      tap: $$mdi:bluetooth-connect$$
      right: '0'
    '&bt_1':
      tap: $$mdi:bluetooth-connect$$
      right: '1'
    '&bt_2':
      tap: $$mdi:bluetooth-connect$$
      right: '2'
    '&bt_3':
      tap: $$mdi:bluetooth-connect$$
      right: '3'